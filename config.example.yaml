provider: openai
api_key_env: OPENAI_API_KEY
base_url_env: OPENAI_BASE_URL
log_level: INFO
judge_enabled: false

prompts_dir: prompts
schemas_dir: schemas
runs_dir: runs
benchmark_results_dir: benchmarks/results

thresholds:
  max_moderate_issues: 2
  min_writing_quality: 24

roles:
  architect:
    model: gpt-4o-mini
    temperature: 0.2
    max_output_tokens: 4000
    timeout_seconds: 180
    structured_mode: auto
  writer:
    model: gpt-4o-mini
    temperature: 0.7
    max_output_tokens: 4000
    timeout_seconds: 180
  critic:
    model: gpt-4o-mini
    temperature: 0.1
    max_output_tokens: 4000
    timeout_seconds: 180
    structured_mode: auto
  patcher:
    model: gpt-4o-mini
    temperature: 0.3
    max_output_tokens: 6000
    timeout_seconds: 180
