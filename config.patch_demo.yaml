provider: openai
api_key_env: OPENAI_API_KEY
base_url_env: OPENAI_BASE_URL
log_level: INFO
judge_enabled: false

thresholds:
  max_moderate_issues: 0
  min_writing_quality: 31

roles:
  architect:
    model: deepseek-v4-flash
    temperature: 0.2
    max_output_tokens: 4000
    timeout_seconds: 150
    structured_mode: none
    reasoning_effort: low
  writer:
    model: deepseek-v4-flash
    temperature: 0.7
    max_output_tokens: 4000
    timeout_seconds: 150
    reasoning_effort: low
  critic:
    model: deepseek-v4-flash
    temperature: 0.1
    max_output_tokens: 4000
    timeout_seconds: 150
    structured_mode: none
    reasoning_effort: low
  patcher:
    model: deepseek-v4-flash
    temperature: 0.3
    max_output_tokens: 6000
    timeout_seconds: 150
    reasoning_effort: low
